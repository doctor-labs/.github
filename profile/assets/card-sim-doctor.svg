<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
<defs>
<clipPath id="clip-sim-doctor"><rect width="600" height="200" rx="18"/></clipPath>
<radialGradient id="glow-sim-doctor" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2DD4BF" stop-opacity="0.38"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
</defs>
<g clip-path="url(#clip-sim-doctor)">
<rect width="600" height="200" fill="#0F172A"/>
<circle cx="80" cy="100" r="170" fill="url(#glow-sim-doctor)"/>
<rect width="8" height="200" fill="#2DD4BF"/>
</g>
<rect x="0.5" y="0.5" width="599" height="199" rx="18" fill="none" stroke="#1E293B"/>
<g transform="translate(26 50) scale(0.78125)"><defs>
    <linearGradient id="sim-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="sim-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <filter id="sim-shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="b"/>
      <feOffset in="b" dx="0" dy="3" result="o"/>
      <feComponentTransfer in="o" result="s"><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#sim-shadow)">
    <path d="M40 8 H80 L96 24 V84 Q96 92 88 92 H40 Q32 92 32 84 V16 Q32 8 40 8 Z" fill="url(#sim-body)"/>
    <g fill="url(#sim-gold)">
      <rect x="44" y="26" width="16" height="12" rx="2.5"/>
      <rect x="68" y="26" width="16" height="12" rx="2.5"/>
      <rect x="44" y="42" width="16" height="12" rx="2.5"/>
      <rect x="68" y="42" width="16" height="12" rx="2.5"/>
      <rect x="44" y="58" width="16" height="12" rx="2.5"/>
      <rect x="68" y="58" width="16" height="12" rx="2.5"/>
    </g>
    <rect x="44" y="78" width="40" height="4" rx="2" fill="#CCFBF1" opacity="0.7"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 40 V76 C18 96 38 104 64 104 C90 104 110 96 110 76 V40" stroke="#475569" stroke-width="11"/>
      <path d="M18 40 V76 C18 96 38 104 64 104 C90 104 110 96 110 76 V40" stroke="#F1F5F9" stroke-width="5"/>
    </g>
    <circle cx="18" cy="40" r="6" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
    <circle cx="110" cy="40" r="6" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
    <circle cx="64" cy="104" r="12" fill="#F1F5F9" stroke="#475569" stroke-width="3"/>
    <circle cx="64" cy="104" r="4.5" fill="#94A3B8"/>
  </g></g>
<text x="152" y="84" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#F8FAFC">sim-doctor</text>
<rect x="518" y="60" width="58" height="26" rx="13" fill="#2DD4BF" fill-opacity="0.18" stroke="#2DD4BF" stroke-opacity="0.6"/>
<text x="547.0" y="78" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5EEAD4">Rust</text>
<text x="152" y="118" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#CBD5E1">SIM / UICC / eUICC cards over PC/SC</text>
<rect x="152" y="132" width="256" height="34" rx="9" fill="#1E293B" stroke="#334155"/>
<text x="165" y="155" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#E2E8F0">cargo install sim-doctor</text>
<text x="152" y="190" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#94A3B8">also: npx sim-doctor</text>
</svg>
