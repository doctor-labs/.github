<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="labs-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19c3ab"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <filter id="labs-shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b"/>
      <feOffset in="b" dx="0" dy="2.5" result="o"/>
      <feComponentTransfer in="o" result="s"><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#labs-bg)"/>
